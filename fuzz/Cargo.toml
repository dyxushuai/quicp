[package]
name = "quicp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
quicp = { path = ".." }

[patch.crates-io]
quicp-noq = { path = "../vendor/noq" }
quicp-noq-proto = { path = "../vendor/noq-proto" }

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false
