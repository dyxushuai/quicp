name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Audit dependencies with RustSec
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo fmt --all -- --check
      - run: cargo clippy --no-default-features --all-targets --locked -- -D warnings
      - run: cargo clippy --all-features --all-targets --locked -- -D warnings
      - run: cargo test --no-default-features --locked
      - run: cargo test --features runtime-tokio --locked
      - run: cargo test --all-features --locked
      - run: cargo test --features ffi-c --test ffi --locked
      - run: cargo run --locked --example echo
      - run: cargo run --locked --example multipath
      - run: cargo run --locked --example zero_rtt
      - run: cargo run --locked --example smoltcp_bridge --features platform-smoltcp
      - run: cargo hack check --feature-powerset --depth 2 --all-targets --locked
      - name: Verify docs.rs metadata
        run: >-
          cargo metadata --format-version 1 --no-deps |
          jq -e '.packages[] | select(.name == "quicp") | .metadata.docs.rs as $d |
          ($d.features | sort) == (["ffi-c", "platform-smoltcp", "runtime-tokio", "tls-rustls"] | sort)'
      - name: Build stable API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --features runtime-tokio,tls-rustls,platform-smoltcp,ffi-c --no-deps --locked
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: 1.88.0
      - name: C ABI header smoke
        run: |
          printf '%s\n' \
            '#include <stdint.h>' \
            '#include <stddef.h>' \
            '#include "quicp.h"' \
            '_Static_assert(sizeof(quicp_socket_address_t) == 24, "address layout");' \
            '_Static_assert(sizeof(quicp_path_config_t) == 48, "path layout");' \
            '_Static_assert(sizeof(quicp_engine_config_t) == 120, "engine layout");' \
            '_Static_assert(offsetof(quicp_engine_config_t, abi_version) == 0, "ABI version offset");' \
            '_Static_assert(offsetof(quicp_engine_config_t, role) == 4, "role offset");' \
            '_Static_assert(sizeof(quicp_bytes_t) == 16, "bytes layout");' \
            '_Static_assert(sizeof(quicp_tls_config_t) == 64, "TLS layout");' \
            '_Static_assert(sizeof(quicp_recovery_snapshot_t) == 104, "snapshot layout");' \
            '_Static_assert(sizeof(quicp_flow_t) == 8, "flow layout");' \
            'int main(void) { return quicp_abi_version() == QUICP_ABI_VERSION ? 0 : 1; }' \
            | cc -std=c11 -Wall -Wextra -Werror -Iinclude -x c -fsyntax-only -
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - run: cargo +nightly fuzz run protocol -- -max_total_time=60

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check the host-driven Windows profile
        run: cargo check --no-default-features --locked
      - name: Run the Windows host-driven tests
        run: cargo test --all-features --locked
      - name: Run the Windows runtime-neutral examples
        run: |
          cargo run --all-features --locked --example echo
          cargo run --all-features --locked --example multipath
          cargo run --all-features --locked --example zero_rtt

  apple:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - run: cargo check --locked --features ffi-c --target aarch64-apple-ios
      - run: cargo check --locked --features ffi-c --target aarch64-apple-ios-sim
      - run: cargo check --locked --features ffi-c --target x86_64-apple-ios
      - run: cargo check --locked --features platform-smoltcp --target aarch64-apple-ios
      - run: cargo check --locked --features runtime-tokio --target aarch64-apple-ios
      - run: cargo check --locked --features runtime-tokio --target aarch64-apple-darwin
      - run: cargo test --locked
      - run: cargo test --all-features --locked
      - run: sh sdk/apple/build-xcframework.sh
      - name: Build Swift wrapper for iOS device and simulator
        run: |
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          IOS_SIMULATOR_SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swift build --package-path sdk/apple --product Quicp \
            --triple arm64-apple-ios15.0 --sdk "$IOS_SDK" \
            --scratch-path "$RUNNER_TEMP/quicp-swift-ios" \
            -Xswiftc -warnings-as-errors
          swift build --package-path sdk/apple --product Quicp \
            --triple arm64-apple-ios15.0-simulator --sdk "$IOS_SIMULATOR_SDK" \
            --scratch-path "$RUNNER_TEMP/quicp-swift-ios-simulator" \
            -Xswiftc -warnings-as-errors
      - run: swift test --package-path sdk/apple
      - name: Type-check Network Extension example
        run: |
          SWIFT_BIN=$(swift build --package-path sdk/apple --show-bin-path)
          xcrun swiftc -typecheck -warnings-as-errors \
            -target "$(uname -m)-apple-macosx12.0" \
            -I "$SWIFT_BIN" -I "$SWIFT_BIN/include" \
            sdk/apple/Examples/QuicpNetworkExtensionPacketTunnelProvider.swift

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-21 build-tools;35.0.0 ndk;28.2.13676358
      - name: Pin Android NDK path
        run: |
          printf 'ANDROID_NDK_ROOT=%s\n' "$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          printf 'ANDROID_NDK_HOME=%s\n' "$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: cargo ndk -t arm64-v8a -t x86_64 -P 21 check --locked --features ffi-c
      - run: cargo ndk -t arm64-v8a -t x86_64 -P 21 check --locked --features platform-smoltcp
      - run: cargo ndk -t arm64-v8a -t x86_64 -P 21 check --locked --features runtime-tokio
      - run: cargo ndk -t arm64-v8a -t x86_64 -P 21 rustc --locked --features ffi-c,tls-rustls --crate-type staticlib
      - name: Build Android JNI bridges
        run: |
          cmake -S sdk/android -B "$RUNNER_TEMP/quicp-jni-arm64" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DQUICP_RUST_LIB="$GITHUB_WORKSPACE/target/aarch64-linux-android/debug/libquicp.a"
          cmake --build "$RUNNER_TEMP/quicp-jni-arm64" --parallel
          cmake -S sdk/android -B "$RUNNER_TEMP/quicp-jni-x86_64" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-21 \
            -DQUICP_RUST_LIB="$GITHUB_WORKSPACE/target/x86_64-linux-android/debug/libquicp.a"
          cmake --build "$RUNNER_TEMP/quicp-jni-x86_64" --parallel
      - name: Run Kotlin engine smoke
        run: |
          cargo rustc --release --locked --features ffi-c,tls-rustls --crate-type staticlib
          cmake -S sdk/android -B "$RUNNER_TEMP/quicp-jni-host" \
            -DQUICP_RUST_LIB="$GITHUB_WORKSPACE/target/release/libquicp.a"
          cmake --build "$RUNNER_TEMP/quicp-jni-host" --parallel
          gradle -p sdk/android \
            -PquicpJniDir="$RUNNER_TEMP/quicp-jni-host" smokeTest
      - name: Type-check VpnService example
        run: gradle -p sdk/android compileExampleKotlin
