name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cargo-hack
      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "quicp") | .version')"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo hack check --feature-powerset --depth 2 --all-targets --locked
      - name: Build release documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps --locked
      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: 1.88.0
      - run: cargo package --locked
      - run: cargo publish --dry-run --locked

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Publish the crate when this version is not present
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "quicp") | .version')"
          if cargo info --registry crates-io "quicp@${version}" >/dev/null 2>&1; then
            echo "quicp ${version} is already published"
          else
            test -n "${CARGO_REGISTRY_TOKEN:-}" || {
              echo "::error::Set the CARGO_REGISTRY_TOKEN repository secret or configure crates.io trusted publishing."
              exit 1
            }
            cargo publish --locked
          fi
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          cargo package --locked --no-verify
          sha256sum "target/package/quicp-${version}.crate" > "target/package/quicp-${version}.crate.sha256"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" \
              "target/package/quicp-${version}.crate" \
              "target/package/quicp-${version}.crate.sha256" \
              --clobber
          else
            gh release create "${tag}" \
              --title "QUICP ${tag}" \
              --generate-notes \
              "target/package/quicp-${version}.crate" \
              "target/package/quicp-${version}.crate.sha256"
          fi
