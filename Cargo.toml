[package]
name = "quicp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "A QUIC-based TCP alternative over a FakeTCP carrier"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/dyxushuai/quicp"
documentation = "https://github.com/dyxushuai/quicp#documentation"
[profile.release]
lto = "thin"
codegen-units = 1

# Rust 1.88 cannot load proc-macro metadata stripped by current Apple toolchains.
[profile.release.build-override]
strip = "none"

[features]
ffi-c = []
platform-smoltcp = ["dep:smoltcp"]
runtime-tokio = [
    "dep:libc",
    "dep:socket2",
    "dep:tokio",
    "noq/runtime-tokio",
]
tls-rustls = ["noq/rustls-ring"]

[package.metadata.docs.rs]
features = ["runtime-tokio", "tls-rustls", "platform-smoltcp", "ffi-c"]

[dependencies]
crc32c = "0.6"
futures-core = "0.3"
# Pinned QUIC substrate; QUICP framing and recovery remain in this crate.
noq = { version = "=1.1.1", default-features = false, features = ["ring"] }
# The backend's crypto seam exposes transport parameters through this protocol crate.
noq-proto = { version = "=1.1.1", default-features = false, features = ["ring"] }
bytes = { version = "1", default-features = false, features = ["std"] }
ring = { version = "0.17.14", default-features = false, features = ["alloc", "std"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
smoltcp = { version = "0.12.0", default-features = false, optional = true, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "async"] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", optional = true, features = ["io-util", "macros", "net", "rt", "time"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = { version = "0.2", optional = true }
socket2 = { version = "0.6.5", features = ["all"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
rcgen = "=0.14.8"
tempfile = "3.20"

[[bench]]
name = "loopback"
harness = false
required-features = ["runtime-tokio"]

[[bench]]
name = "carrier_encode"
harness = false

[[bench]]
name = "carrier_decode"
harness = false

[[example]]
name = "smoltcp_bridge"
required-features = ["platform-smoltcp"]

[[example]]
name = "socks5_tunnel"
required-features = ["runtime-tokio"]

[[test]]
name = "flow"
required-features = ["runtime-tokio"]

[[test]]
name = "ffi"
required-features = ["ffi-c"]

[[test]]
name = "platform"
required-features = ["platform-smoltcp"]

[[test]]
name = "smolstack"
required-features = ["platform-smoltcp"]

[[test]]
name = "raw_faketcp_multipath"
required-features = ["runtime-tokio"]

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
all = "deny"
pedantic = "deny"

[patch.crates-io]
noq = { path = "vendor/noq" }
noq-proto = { path = "vendor/noq-proto" }
